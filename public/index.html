<br><div class="card"><h2>🔥 Твой маршрут</h2><div class="grid g4">${modules.map(m=>{let n=lessons.filter(l=>l.module==m.id).length,d=lessons.filter(l=>l.module==m.id&&state.done.includes(l.id)).length;return `<div><b>${m.icon} ${m.title}</b><div class="muted">${d}/${n}</div><div class="progress"><i style="width:${Math.round(d/n*100)}%"></i></div></div>`}).join("")}</div></div>`}
function stageForLesson(ls,i){const n=ls.length, r=(i+1)/n; return r<=0.34?{name:"Beginner",ru:"Начальный",icon:"🌱",desc:"Понимание основ и базовые действия."}:r<=0.67?{name:"Intermediate",ru:"Средний",icon:"⚡",desc:"Самостоятельная работа с реальными задачами."}:{name:"Advanced",ru:"Продвинутый",icon:"🚀",desc:"Сложные задачи, анализ и бизнес-решения."}}
function stageMeta(ls){return [{name:"Beginner",ru:"Начальный",icon:"🌱",desc:"Понимание основ и базовые действия."},{name:"Intermediate",ru:"Средний",icon:"⚡",desc:"Самостоятельная работа с реальными задачами."},{name:"Advanced",ru:"Продвинутый",icon:"🚀",desc:"Сложные задачи, анализ и бизнес-решения."}].map((s,i)=>{const a=Math.floor(i*ls.length/3),b=Math.floor((i+1)*ls.length/3),items=ls.slice(a,b);return {...s,items,done:items.filter(x=>state.done.includes(x.id)).length}})}
function courses(){const roadmap=modules.map((m,i)=>{const ls=lessons.filter(l=>l.module==m.id);const d=ls.filter(l=>state.done.includes(l.id)).length;const first=ls[0]?.title||"";const stages=stageMeta(ls);return `<div class="card"><div class="row"><span class="pill">Шаг ${i+1}</span><b>${m.icon} ${esc(m.title)}</b><span class="tag">${d}/${ls.length}</span></div><p class="muted">Начни с «${esc(first)}». Внутри: Beginner → Intermediate → Advanced.</p><div class="grid g3">${stages.map((s,j)=>`<div class="card" style="margin:0;background:#0b1624"><b>${s.icon} ${s.name}</b><div class="tag">${s.ru}</div><p class="muted">${s.desc}</p><span class="tag">${s.done}/${s.items.length} уроков</span></div>`).join("")}</div></div>`}).join("");document.getElementById("app").innerHTML=head("Обучение","Курсы",`${lessons.length} уроков с понятным маршрутом от Beginner до Advanced.`)+`<div class="card"><h2>🗺️ Как проходить программу</h2><p class="muted">Иди сверху вниз. В каждом модуле три уровня: <b>Beginner</b> — понять основу, <b>Intermediate</b> — научиться применять, <b>Advanced</b> — решать более сложные аналитические задачи. Не переходи дальше только ради галочки: сначала сделай практику и проверь себя.</p><div class="grid g2">${roadmap}</div></div><div class="grid g2">${modules.map(m=>{let ls=lessons.filter(l=>l.module==m.id),d=ls.filter(l=>state.done.includes(l.id)).length,stages=stageMeta(ls);return `<div class="card"><div class="row"><h2>${m.icon} ${m.title}</h2><span class="pill">${d}/${ls.length}</span></div><p class="muted">${stages.map(s=>`${s.icon} ${s.name}: ${s.done}/${s.items.length}`).join(" · ")}</p>${ls.slice(0,4).map((l,li)=>`<div class="lesson" onclick="${stageUnlocked(ls,li)?`lesson('${l.id}')`:`toast('Сначала заверши предыдущий уровень 🔒')`}"><div class="num">${state.done.includes(l.id)?"✓":"→"}</div><div><b>${l.title}</b><div class="tag">${stageForLesson(ls,ls.indexOf(l)).icon} ${stageForLesson(ls,ls.indexOf(l)).name} · ${l.minutes} мин · ${l.points} XP</div></div></div>`).join("")}<button class="btn secondary" onclick="module('${m.id}')">Открыть весь модуль →</button></div>`}).join("")}</div>`}
function stageIndex(ls,i){return i<Math.ceil(ls.length/3)?0:i<Math.ceil(ls.length*2/3)?1:2}
function stageUnlocked(ls,i){const st=stageIndex(ls,i);if(st===0)return true;const cutoff=st===1?Math.ceil(ls.length/3):Math.ceil(ls.length*2/3);return ls.slice(0,cutoff).every(x=>state.done.includes(x.id))}
function lessonStageInfo(l){const ls=lessons.filter(x=>x.module===l.module),i=ls.findIndex(x=>x.id===l.id),st=stageForLesson(ls,i);return {ls,i,st,unlocked:stageUnlocked(ls,i)}}
function module(id){let m=modules.find(x=>x.id==id),ls=lessons.filter(l=>l.module==id),stages=stageMeta(ls);document.getElementById("app").innerHTML=head(m.icon,m.title,`Полный модуль · ${ls.length} уроков · Beginner → Intermediate → Advanced`)+`<div class="card"><h2>📍 Твой маршрут в модуле</h2><p class="muted">Сначала пройди Beginner, затем Intermediate и только потом Advanced. Это не просто три названия: сложность постепенно растёт.</p><div class="grid g3">${stages.map(s=>`<div class="card" style="margin:0;background:#0b1624"><h3>${s.icon} ${s.name}</h3><div class="tag">${s.ru}</div><p class="muted">${s.desc}</p><b>${s.done}/${s.items.length}</b> уроков</div>`).join("")}</div><br><div class="progress"><i style="width:${Math.round(ls.filter(l=>state.done.includes(l.id)).length/ls.length*100)}%"></i></div></div><div class="card">${ls.map((l,i)=>{const st=stageForLesson(ls,i);const unlocked=stageUnlocked(ls,i);return `<div class="lesson" style="opacity:${unlocked?1:.55};cursor:${unlocked?'pointer':'not-allowed'}" onclick="${unlocked?`lesson('${l.id}')`:`toast('Сначала заверши предыдущий уровень 🔒')`}"><div class="num">${state.done.includes(l.id)?"✓":(unlocked?i+1:'🔒')}</div><div style="flex:1"><b>${l.title}</b><div class="muted">${l.summary}</div><div class="tag">${st.icon} ${st.name} · ${st.ru} · ${l.minutes} минут · ${l.points} XP</div></div></div>`}).join("")}</div>`}
function lessonContent(l){const t=l.title.toLowerCase();const map=[
[/data analytics|аналитики/,['Data Analytics — это процесс превращения сырых данных в выводы, которые помогают принять решение. Аналитик формулирует вопрос, проверяет качество данных, ищет закономерности и объясняет, что делать дальше.','Рабочий цикл: вопрос → данные → очистка → анализ → визуализация → вывод → действие.']],
[/типы данных/,['Перед анализом важно понимать, что находится в каждой колонке: числа, текст, даты, категории или логические значения. От типа данных зависит, какие операции и графики будут корректными.','Например, цену можно усреднять, бренд — группировать, а дату — превращать в месяц или год.']],
[/метрики и kpi/,['Метрика — измеримый показатель, а KPI — показатель, особенно важный для конкретной цели бизнеса. Хороший KPI связан с решением.','Например, выручка показывает масштаб продаж, а conversion rate помогает понять, насколько хорошо посетители становятся покупателями.']],
[/среднее|медиана|мода/,['Среднее — сумма значений, делённая на количество. Медиана — центральное значение после сортировки. Мода — наиболее частое значение.','При сильных выбросах медиана часто лучше описывает типичный результат, чем среднее.']],
[/проценты|изменения/,['Процентное изменение показывает рост или падение относительно исходного значения: (новое − старое) / старое × 100%.','Если продажи выросли со 100 до 120, рост равен 20%. Всегда проверяй базу сравнения.']],
[/корреляция|причинность/,['Корреляция показывает связь между переменными, но сама по себе не доказывает причинность. На обе переменные может влиять третий фактор.','Например, продажи мороженого и посещаемость пляжа растут летом одновременно, но одно не обязательно является причиной другого.']],
[/очистка данных/,['Очистка данных — поиск и исправление пропусков, дублей, неверных типов, лишних пробелов, неправильных дат и невозможных значений.','Сначала выясни причину проблемы, затем исправляй её. Не удаляй строки автоматически без понимания последствий.']],
[/excel/,['Excel — удобная среда для таблиц, формул, фильтров, сводных таблиц и графиков. В аналитике важно держать данные в аккуратной табличной структуре.','Обычно одна строка содержит один объект, а один столбец — один признак.']],
[/sql|select|where|join|group by|having|cte|window/,['SQL позволяет задавать базе данных точные вопросы. Сначала выбираются нужные данные и фильтруются строки, затем выполняются группировки, соединения и вычисления.','Читай запрос как последовательность действий: что берём → что фильтруем → как группируем → что выводим.']],
[/python|pandas|dataframe|csv|groupby|merge|missing/,['Python помогает автоматизировать расчёты и повторяемую обработку данных. Pandas добавляет удобные таблицы DataFrame и операции фильтрации, группировки и объединения.','Типичный процесс: загрузить данные → проверить → очистить → отфильтровать → сгруппировать → посчитать метрики → визуализировать.']],
[/power bi|dax|measure|relationships|star schema/,['Power BI объединяет подготовку данных, модель и визуализацию. DAX используется для measures, а relationships определяют, как таблицы фильтруют друг друга.','Хороший отчёт отвечает на бизнес-вопрос быстро и позволяет перейти от общего показателя к деталям.']],
[/statistics|статист/,['Статистика помогает описывать данные, измерять разброс и понимать неопределённость. Это особенно важно, когда вывод делается по выборке, а не по всей совокупности.','Не ограничивайся средним: смотри на разброс, распределение и размер выборки.']],
[/visualization|график|chart|dashboard/,['Визуализация должна помогать увидеть ответ, а не просто украшать отчёт. Выбор графика зависит от задачи: сравнение, тренд, распределение или связь.','Сначала сформулируй вопрос, затем выбери график и убери всё, что не помогает ответить на него.']],
[/business|revenue|profit|conversion|retention|churn|cac|ltv|funnel|cohort|unit economics/,['Business Analytics связывает данные с экономикой компании: выручкой, затратами, клиентами и решениями. Аналитик должен понимать, почему показатель важен для бизнеса.','Финальный результат анализа — не таблица, а вывод: что произошло, почему это важно и какое действие стоит проверить.']]
];for(const [re,v] of map)if(re.test(t))return {what:v[0],how:v[1]};return {what:`На этом уроке разбираем тему «${l.title}» и связываем её с реальной работой аналитика. Важно понять не только определение, но и проблему, которую инструмент решает.`,how:'Используй цикл: понять идею → разобрать пример → сделать мини-практику → объяснить результат своими словами → перейти дальше.'};}
function lessonPath(l){const ms=modules.map(m=>m.id),mi=ms.indexOf(l.module),ls=lessons.filter(x=>x.module==l.module),i=ls.findIndex(x=>x.id==l.id);return {next:i<ls.length-1?ls[i+1]:(modules[mi+1]?lessons.find(x=>x.module==modules[mi+1].id):null)};}
function lesson(id){let l=lessons.find(x=>x.id==id);const info=lessonStageInfo(l);if(!info.unlocked){toast('Сначала заверши предыдущий уровень 🔒');return;}currentLesson=l;const c=lessonContent(l),path=lessonPath(l),ls=lessons.filter(x=>x.module==l.module),idx=ls.findIndex(x=>x.id==l.id);document.getElementById("app").innerHTML=head(l.icon,l.title,`${l.level} · ${l.minutes} минут · ${l.points} XP`)+`<div class="card" style="margin-bottom:18px"><div class="row"><div><b>🗺️ Где ты находишься</b><div class="muted">Модуль: ${esc(modules.find(m=>m.id==l.module)?.title||l.module)} · Урок ${idx+1} из ${ls.length}</div></div><span class="pill">${state.done.includes(l.id)?"Пройдено ✓":"В процессе"}</span></div><div class="progress"><i style="width:${Math.round((lessons.findIndex(x=>x.id==l.id)+1)/lessons.length*100)}%"></i></div><p class="muted">Порядок работы: теория → пример → мини-практика → проверка себя → завершение урока.</p></div><div class="grid g2"><div class="card"><h2>🎯 Цель</h2><p>${esc(l.goal||'Понять тему и научиться применять её на данных.')}</p><h2>🧠 Что это и зачем</h2><p>${esc(c.what)}</p><h2>🔎 Как это работает</h2><p>${esc(c.how)}</p><h2>📖 Главное</h2>${l.key_points.map((x,i)=>`<p><b>${i+1}.</b> ${esc(x)}</p>`).join('')}<h3>⚠️ Типичные ошибки</h3>${(l.common_mistakes||[]).map(x=>`<p class="muted">• ${esc(x)}</p>`).join('')}</div><div class="card"><h2>💡 Разбор примера</h2><pre style="white-space:pre-wrap;background:#06111d;padding:15px;border-radius:12px">${esc(l.example)}</pre><h2>🧪 Мини-практика</h2><p>${esc(l.mini_task||'Сделай небольшое упражнение по теме и запиши результат.')}</p><div class="card" style="background:#0b1624;margin:14px 0"><h3>✅ Проверь себя</h3><p class="muted">${esc(l.check)}</p></div><h2>🚀 Что дальше</h2><p class="muted">${path.next?`Следующий рекомендуемый урок: «${esc(path.next.title)}». Переходи дальше, когда можешь объяснить текущую тему без подсказок.`:'Ты завершил этот модуль. Закрепи знания мини-проектом или переходи к следующему модулю.'}</p><div class="teacher-mini"><div class="row"><div><span class="pill">🧑‍🏫 Учитель рядом</span><h3 style="margin:8px 0 4px">Не понял? Не получишь ответ — получишь направление.</h3></div></div><p class="muted">Попробуй сначала сам. Если застрял, нажми кнопку и учитель разобьёт задачу на шаги, опираясь на эту тему.</p><button class="btn secondary" onclick="openTeacher()">Попросить подсказку →</button></div><button class="btn" onclick="finishLesson('${l.id}')">${state.done.includes(l.id)?'Повторить урок':'Завершить урок'} (+${l.points} XP)</button></div></div>`}
function teacherCategory(){
 if(currentExercise?.category)return currentExercise.category;
 if(currentLesson?.module){const map={fundamentals:"Основы аналитики",excel:"Excel",sql:"SQL",python:"Python","power-bi":"Power BI",statistics:"Statistics",visualization:"Visualization",business:"Business"};return map[currentLesson.module]||"Business";}

 m.innerHTML=`<div class="modalbox"><div class="eyebrow">PERSONAL TEACHER</div>
 <div class="row"><div><h2>🧑‍🏫 Разберём вместе</h2><p class="muted">${esc(category)}</p></div><span class="pill">Без готового ответа</span></div>

 const guides={
  Excel:["Сначала назови действие: сложить, найти, сравнить, сгруппировать или отфильтровать. Какое действие просит задача?","Теперь вспомни инструмент Excel для этого действия. Проверь его назначение и аргументы, прежде чем выбирать.","Представь маленький пример вручную. Какой результат должен получиться? Затем выбери инструмент, который даёт именно такой результат."],

  Python:["Сначала определи объект: часто это DataFrame. Затем определи действие: фильтрация, группировка, выбор или объединение.","Не угадывай весь код. Вспомни название операции из урока и проверь её на маленьком примере.","Представь промежуточный результат после операции. Что должно измениться в таблице? Это подскажет нужный метод."],
  "Power BI":["Определи, что нужно изменить: данные, модель или визуализацию. От этого зависит инструмент.","Вспомни этап работы Power BI: Power Query готовит данные, relationships связывают таблицы, DAX считает меры.","Сформулируй ожидаемый результат своими словами и сопоставь его с инструментом из соответствующего урока."],
  Statistics:["Сначала определи, что спрашивают: центр, разброс, связь или вероятность.","Подумай о выбросах и размере выборки. Как они влияют на показатель, который ты выбираешь?","Сделай маленький мысленный пример из нескольких чисел и проверь, какой показатель ведёт себя так, как требует условие."],

 };
 const g=guides[category]||["Разбей задачу на маленькие части и назови тему, которую она проверяет.","Вспомни пример из последнего урока и сравни его с текущей задачей.","Объясни задачу своими словами без вариантов ответа. Затем выбери инструмент или концепцию, которая выполняет именно это действие."];
 const a=Math.min(Math.max(Number(attempt)||1,1),3), text=g[a-1];
 const payload=encodeURIComponent(JSON.stringify({category,question,attempt:a+1}));
 return `<div id="teacherBox" class="card" style="margin-top:14px;border-color:#355c88;background:linear-gradient(180deg,#102942,#0b1a2a)"><div class="row"><div><span class="pill">🧑‍🏫 Учитель</span><h3 style="margin:8px 0 4px">Я не дам ответ — я помогу тебе его найти</h3></div><span class="tag">Подсказка ${a}/3</span></div><p>${esc(text)}</p><p class="muted"><b>Твой следующий шаг:</b> объясни себе, почему выбранный вариант подходит условию. Если всё ещё не получается, попроси следующую подсказку.</p>${a<3?`<button class="btn secondary" onclick="showTeacherHint('${payload}')">Следующая подсказка →</button>`:`<p class="muted">Последняя подсказка: вернись к соответствующему примеру урока и попробуй решить задачу ещё раз самостоятельно.</p>`}</div>`;
}
function showTeacherHint(payload){try{const d=JSON.parse(decodeURIComponent(payload));const box=document.getElementById("teacherBox");if(box)box.outerHTML=teacherPanel(d.category,d.question,d.attempt);}catch(e){}}
let practiceIndex=0,practiceAttempt=1;
function practice(){
 const q=exercises[practiceIndex%exercises.length]; currentExercise=q;
 document.getElementById("app").innerHTML=head("Practice Lab","Практика с учителем",`Задание ${practiceIndex+1} из ${exercises.length} · ${q.category} · ${q.difficulty}`)+`<div class="card"><div class="row"><span class="pill">${esc(q.category)}</span><span class="tag">${esc(q.difficulty)}</span></div><h2>${esc(q.question)}</h2><p class="muted">Выбери ответ. Если ошибёшься, учитель даст ступенчатую подсказку, но не покажет решение.</p>${q.options.map((o,i)=>`<button class="option" onclick="answer(${i})">${esc(o)}</button>`).join("")}<div id="teacherArea"></div></div>`;
}
function answer(i){
 const q=currentExercise;if(!q)return; const opts=document.querySelectorAll(".option"), selected=q.options[i]; opts.forEach(b=>b.disabled=true);
 state.answers++; const ok=selected===q.answer;
 if(ok){state.correct++;state.xp+=10;state.streak++;opts[i].classList.add("correct");document.getElementById("teacherArea").innerHTML=`<div class="card" style="margin-top:14px;border-color:#236b43"><h3>✅ Отлично. Ты сам нашёл решение.</h3><p class="muted">Теперь объясни себе, почему этот вариант подходит условию. Это важнее, чем просто запомнить ответ.</p><button class="btn" onclick="practiceIndex++;practiceAttempt=1;practice()">Следующее задание →</button></div>`;save();}
 else {state.streak=0;opts[i].classList.add("wrong");recordTeacherMistake(q.category);document.getElementById("teacherArea").innerHTML=teacherPanel(q.category,q.question,Math.min((state.teacherMistakes[q.category]||1),3));practiceAttempt=Math.min(practiceAttempt+1,3);save();}
}
function exams(){
 clearInterval(examInterval);
 let qs=DATA.examQuestions, idx=0, score=0, timer=60;
 function renderQ(){
   if(idx>=qs.length){clearInterval(examInterval);document.getElementById("app").innerHTML=head("Exam Mode","Экзамен завершён","Результат сохраняется в твоём профиле.")+
   `<div class="card"><div class="big">${score}/${qs.length}</div><h2>${Math.round(score/qs.length*100)}%</h2><p class="muted">Повтори темы, где были ошибки, и попробуй снова.</p><button class="btn" onclick="go('exams')">Пройти снова</button></div>`;return;}
   let q=qs[idx];document.getElementById("app").innerHTML=head("Exam Mode","Final Data Analyst Exam",`Вопрос ${idx+1} из ${qs.length}`)+
   `<div class="card"><div class="row"><span class="badge">${esc(q.cat)}</span><span class="timer" id="tm">${timer}s</span></div><h2>${esc(q.q)}</h2>${q.o.map(o=>`<button class="choice" onclick='window.__exam(${JSON.stringify(o).replace(/'/g,"&#39;")})'>${esc(o)}</button>`).join("")}</div>`;
 }
 window.__exam=(o)=>{let q=qs[idx];if(!q)return;document.querySelectorAll(".choice").forEach(b=>{b.disabled=true;if(b.textContent===q.a)b.classList.add("good");if(b.textContent===o&&o!==q.a)b.classList.add("bad")});if(o===q.a){score++;state.xp+=20;idx++;setTimeout(renderQ,700)}else{recordTeacherMistake(q.cat||"Business");const card=document.querySelector(".card");if(card){card.insertAdjacentHTML("beforeend",teacherPanel(q.cat||"Business",q.q,Math.min(state.teacherMistakes[q.cat||"Business"],3)));}idx++;setTimeout(renderQ,2200)}save()};
 timer=60;renderQ();examInterval=setInterval(()=>{timer--;let t=document.getElementById("tm");if(t)t.textContent=timer+"s";if(timer<=0){idx++;timer=60;renderQ()}},1000);
}
function playground(){
 document.getElementById("app").innerHTML=head("Analytics Playground","Рабочая среда","Безопасная учебная песочница для аналитических задач.")+
 `<div class="grid g2"><div class="card"><h2>🗄️ SQL Lab</h2><p class="muted">Практикуй запросы на учебном датасете. В этой версии редактор имитирует проверку ключевых конструкций.</p><textarea class="codebox" id="sqlcode" placeholder="SELECT brand, SUM(revenue) FROM sales GROUP BY brand;"></textarea><br><br><button class="btn" onclick="runSQL()">▶ Проверить SQL</button><div id="sqlout"></div></div>
 <div class="card"><h2>🐍 Python Lab</h2><p class="muted">Пиши Pandas-код и объясняй, что он делает. Выполнение произвольного кода на сервере пока отключено.</p><textarea class="codebox" id="pycode" placeholder="df.groupby('category')['revenue'].sum()"></textarea><br><br><button class="btn" onclick="runPy()">▶ Проверить решение</button><div id="pyout"></div></div></div>
 <br><div class="notice">🛡️ Безопасность: произвольный пользовательский код не выполняется на сервере. Настоящий sandbox можно подключить отдельно через изолированный execution service.</div>`;
}
function runSQL(){let s=(document.getElementById("sqlcode").value||"").toUpperCase(),need=["SELECT"];let ok=need.every(x=>s.includes(x));if(s.includes("GROUP BY"))ok=true;if(!ok)recordTeacherMistake("SQL");document.getElementById("sqlout").innerHTML=ok?`<p>✅ Структура похожа на корректную учебную задачу. Теперь самостоятельно проверь JOIN, фильтр и агрегирование.</p>`:teacherPanel("SQL","Проверь структуру своего SQL-решения",1);state.xp+=ok?5:0;save()}
function runPy(){let s=document.getElementById("pycode").value||"",ok=/df|pandas|groupby|read_csv|loc|iloc/.test(s);if(!ok)recordTeacherMistake("Python");document.getElementById("pyout").innerHTML=ok?`<p>✅ В решении есть знакомая Pandas-конструкция. Теперь самостоятельно проверь типы и промежуточный результат.</p>`:teacherPanel("Python","Проверь структуру своего Pandas-решения",1);state.xp+=ok?5:0;save()}
function datasets(){
 document.getElementById("app").innerHTML=head("Datasets","Dataset Library","Наборы данных для практики и проектов.")+
 `<div class="grid g3">${DATA.datasets.map(d=>`<div class="card"><div class="badge">${d.rows.toLocaleString()} rows</div><h2>🗃️ ${d.name}</h2><p class="muted">${d.columns} колонок · ${d.tools}</p><p>${d.focus}</p><button class="btn secondary" onclick="toast('Dataset выбран для практики')">Использовать →</button></div>`).join("")}</div>`;
}
function showAuth(mode="login"){const m=document.getElementById("modal");m.classList.remove("hide");m.innerHTML=currentUser?`<div class="modalbox"><div class="eyebrow">ACCOUNT</div><h2>${esc(currentUser.name)}</h2><p class="muted">${esc(currentUser.email)}</p><div class="notice">☁️ Прогресс синхронизируется с аккаунтом и доступен на других устройствах.</div><br><button class="btn" onclick="closeModal()">Продолжить</button> <button class="btn secondary" onclick="logout()">Выйти</button></div>`:authForm(mode)}
function authForm(mode){return `<div class="modalbox"><div class="eyebrow">ANALYTICS ACADEMY</div><h2>${mode==="register"?"Создать аккаунт":"Войти в аккаунт"}</h2><p class="muted">${mode==="register"?"Один аккаунт для ПК, iPad и телефона.":"Продолжи обучение с любого устройства."}</p>${mode==="register"?`<input class="input" id="authName" placeholder="Имя"><br><br>`:""}<input class="input" id="authEmail" type="email" placeholder="Email"><br><br><input class="input" id="authPassword" type="password" placeholder="Пароль (минимум 8 символов)"><br><br><button class="btn" onclick="submitAuth('${mode}')">${mode==="register"?"Создать аккаунт":"Войти"}</button><br><br><button class="btn secondary" onclick="showAuth('${mode==="register"?"login":"register"}')">${mode==="register"?"У меня уже есть аккаунт":"Создать новый аккаунт"}</button><p id="authError" class="muted"></p></div>`}
async function submitAuth(mode){const err=document.getElementById("authError");err.textContent="";const payload={email:document.getElementById("authEmail").value.trim(),password:document.getElementById("authPassword").value};if(mode==="register")payload.name=document.getElementById("authName").value.trim();try{const r=await fetch(`/api/auth/${mode}`,{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});const x=await r.json();if(!r.ok){const map={EMAIL_EXISTS:"Этот email уже зарегистрирован.",INVALID_CREDENTIALS:"Неверный email или пароль.",WEAK_PASSWORD:"Пароль должен содержать минимум 8 символов.",INVALID_EMAIL:"Проверь email.",INVALID_NAME:"Введи имя от 2 до 60 символов.",RATE_LIMITED:"Слишком много попыток. Подожди немного и попробуй снова."};throw new Error(map[x.error]||"Не удалось выполнить действие.")}currentUser=x.user;if(mode==="register"){state={...state,name:currentUser.name};localStorage.setItem("aa_final",JSON.stringify(state));await sync()}else{const r2=await fetch("/api/state",{credentials:"same-origin"});const y=await r2.json();state={...DEFAULT_STATE,...(y.state&&typeof y.state==="object"?y.state:{}),name:currentUser.name};localStorage.setItem("aa_final",JSON.stringify(state))}closeModal();nav("dashboard");dashboard();toast(mode==="register"?"Аккаунт создан ☁️":"Синхронизация включена ☁️")}catch(e){err.textContent=e.message}}
async function logout(){await fetch("/api/auth/logout",{method:"POST",credentials:"same-origin"});currentUser=null;toast("Ты вышел из аккаунта");closeModal();dashboard()}
function closeModal(){document.getElementById("modal").classList.add("hide")}
window.go=go;window.career=career;window.careerDetail=careerDetail;window.teacherPanel=teacherPanel;window.openTeacher=openTeacher;window.showTeacherHint=showTeacherHint;window.adaptive=adaptive;window.exams=exams;window.playground=playground;window.datasets=datasets;window.showAuth=showAuth;window.submitAuth=submitAuth;window.logout=logout;window.closeModal=closeModal;window.lesson=lesson;window.module=module;window.practice=practice;window.answer=answer;window.project=project;window.completeProject=completeProject;window.finishLesson=finishLesson;window.openNext=openNext;
