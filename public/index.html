<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Analytics Academy</title>
<style>
:root{--bg:#06101d;--panel:#0c1929;--panel2:#101f32;--text:#f5f8fc;--muted:#8fa2ba;--blue:#3b82f6;--green:#34d399;--line:#ffffff12}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#122c50 0,#06101d 40%,#040b13 100%);color:var(--text);font:15px Inter,system-ui,-apple-system,Segoe UI,sans-serif}.app{display:flex;min-height:100vh}.side{position:fixed;inset:0 auto 0 0;width:245px;padding:22px 14px;background:#050d17dd;border-right:1px solid var(--line);backdrop-filter:blur(18px);z-index:5}.logo{font-size:19px;font-weight:900;padding:8px 12px 24px}.logo b{color:#60a5fa}.nav{display:grid;gap:4px}.nav button{border:0;background:transparent;color:var(--muted);padding:11px 12px;text-align:left;border-radius:11px}.nav button:hover,.nav button.on{background:#3b82f61c;color:#fff}.nav hr{border:0;border-top:1px solid var(--line);width:90%;margin:15px auto}.main{margin-left:245px;width:calc(100% - 245px);padding:28px;max-width:1500px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:22px}.eyebrow{text-transform:uppercase;letter-spacing:.1em;font-size:11px;color:#70a8ff;font-weight:800}.h1{font-size:30px;margin:5px 0}.grid{display:grid;gap:15px}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:1.4fr 1fr}.card{background:linear-gradient(180deg,#102035ee,#0b1828ee);border:1px solid var(--line);border-radius:18px;padding:19px;box-shadow:0 18px 50px #0003}.hero{padding:25px}.big{font-size:42px;font-weight:900;margin:7px 0}.muted{color:var(--muted)}.progress{height:8px;background:#1a2a3d;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,#2563eb,#60a5fa);border-radius:99px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.btn{border:0;border-radius:11px;padding:10px 14px;background:#2563eb;color:white;font-weight:800}.btn.alt{background:#17283e;color:#dce9f8}.btn.ghost{background:transparent;border:1px solid var(--line)}button{cursor:pointer}.status{padding:5px 9px;border-radius:999px;background:#17283e;color:var(--muted);font-size:11px}.status.blue{background:#3b82f61a;color:#9ec5ff}.status.green{background:#34d39918;color:#8ff0c7}.course{min-height:135px}.course.lock{opacity:.55}.section{margin:28px 0 12px}.section h2{font-size:20px;margin:0}.lesson{display:grid;grid-template-columns:35px 1fr auto;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px}.num{width:30px;height:30px;border-radius:9px;background:#17283e;display:grid;place-items:center}.done .num{background:#34d39918;color:var(--green)}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:13px}.data{border-collapse:collapse;width:100%;min-width:680px}.data th,.data td{padding:11px 13px;text-align:left;border-bottom:1px solid var(--line)}.data th{font-size:11px;color:#9fb2c9;text-transform:uppercase}.data tr:last-child td{border:0}.input,.area,.code{width:100%;background:#06111f;border:1px solid var(--line);color:#fff;border-radius:11px;padding:12px}.area{min-height:100px;resize:vertical}.code{min-height:160px;font-family:monospace;resize:vertical}.output{background:#06111f;border:1px solid var(--line);border-radius:11px;padding:12px;white-space:pre-wrap;margin-top:10px}.pill{font-size:11px;color:var(--muted)}.notice{padding:13px;border-radius:12px;background:#3b82f610;border:1px solid #60a5fa22}.float{position:fixed;right:22px;bottom:20px;z-index:10;border:0;border-radius:99px;padding:13px 16px;background:white;color:#06101d;font-weight:900;box-shadow:0 15px 40px #0007}.modal{position:fixed;inset:0;background:#0009;display:grid;place-items:center;padding:20px;z-index:20}.modalbox{width:min(600px,100%);background:#0b1929;border:1px solid var(--line);border-radius:18px;padding:20px}.chat{height:280px;overflow:auto;display:grid;align-content:start;gap:8px;margin:14px 0}.bubble{background:#14263c;padding:10px 12px;border-radius:12px;max-width:85%}.me{justify-self:end;background:#2563eb33}.hide{display:none!important}.toast{position:fixed;right:22px;bottom:75px;background:#fff;color:#06101d;padding:12px 15px;border-radius:11px;font-weight:800;z-index:30}.badge{font-size:28px}.activity{display:grid;gap:8px}.activity div{padding:10px;border-bottom:1px solid var(--line)}@media(max-width:1000px){.side{width:70px}.logo{font-size:0;text-align:center}.logo:first-letter{font-size:22px}.nav button{font-size:0;text-align:center}.nav button::first-letter{font-size:19px}.main{margin-left:70px;width:calc(100% - 70px)}.g4{grid-template-columns:repeat(2,1fr)}.g2{grid-template-columns:1fr}}@media(max-width:650px){.main{padding:17px}.g4,.g3{grid-template-columns:1fr}.h1{font-size:24px}.top{align-items:flex-start}.float{right:12px;bottom:12px}}
</style>
</head>
<body>
<div class="app">
<aside class="side"><div class="logo">Analytics <b>Academy</b></div><div class="nav" id="nav">
<button data-v="dashboard">🏠 Главная</button><button data-v="roadmap">🗺️ Дорожная карта</button><button data-v="excel">📊 Excel</button><button data-v="sql">🗄️ SQL</button><button data-v="python">🐍 Python</button><button data-v="powerbi">📈 Power BI</button><button data-v="practice">🧪 Практика</button><button data-v="project">🏎️ Car Sales</button><button data-v="portfolio">💼 Моё портфолио</button><button data-v="university">🎓 Университет</button><button data-v="progress">📊 Прогресс</button><button data-v="achievements">🏆 Достижения</button><button data-v="activity">🕘 Активность</button><button data-v="profile">👤 Профиль</button><hr><button id="tutorNav">🤖 AI-репетитор</button></div></aside>
<main class="main" id="app"></main></div>
<button class="float" id="tutor">🤖 AI-репетитор</button>
<div class="modal hide" id="modal"><div class="modalbox"><div class="row"><div><div class="eyebrow">Помощь</div><h2>AI-репетитор</h2></div><button class="btn alt" id="close">Закрыть</button></div><div class="chat" id="chat"><div class="bubble">Привет! Я помогу разобраться, но сначала постараюсь натолкнуть тебя на ответ, а не решить всё за тебя.</div></div><div class="row"><input class="input" id="chatInput" placeholder="Напиши вопрос..."><button class="btn" id="send">Отправить</button></div></div></div>
<script>
const DATA=[
["2026-09-01","BMW","Абу-Даби",100000,4,"Онлайн"],["2026-09-02","Audi","Дубай",80000,7,"Шоурум"],["2026-09-03","Mercedes","Абу-Даби",120000,3,"Онлайн"],["2026-09-04","BMW","Дубай",95000,5,"Шоурум"],["2026-09-05","Toyota","Абу-Даби",55000,9,"Онлайн"],["2026-09-06","Audi","Абу-Даби",82000,6,"Онлайн"],["2026-09-07","BMW","Абу-Даби",110000,4,"Шоурум"],["2026-09-08","Mercedes","Дубай",130000,2,"Шоурум"],["2026-09-09","Toyota","Дубай",52000,10,"Онлайн"],["2026-09-10","BMW","Абу-Даби",98000,6,"Онлайн"],["2026-09-11","Audi","Дубай",85000,5,"Шоурум"],["2026-09-12","Mercedes","Абу-Даби",125000,4,"Онлайн"],["2026-09-13","Toyota","Абу-Даби",58000,8,"Шоурум"],["2026-09-14","BMW","Дубай",102000,7,"Онлайн"],["2026-09-15","Audi","Абу-Даби",79000,4,"Шоурум"],["2026-09-16","Mercedes","Дубай",118000,3,"Онлайн"],["2026-09-17","Toyota","Дубай",60000,9,"Онлайн"],["2026-09-18","BMW","Абу-Даби",108000,5,"Шоурум"],["2026-09-19","Audi","Дубай",83000,8,"Онлайн"],["2026-09-20","Mercedes","Абу-Даби",127000,3,"Шоурум"]];
const lessons=["Интерфейс Excel","Строки и столбцы","Базовые формулы","SUM","AVERAGE","MIN / MAX","IF","Сортировка","Фильтрация","Диаграммы","Сводные таблицы","Мини-проект"];
let state=JSON.parse(localStorage.getItem("aa_full")||'{"name":"Apalon","xp":70,"done":["Интерфейс Excel","Строки и столбцы","Базовые формулы"],"activity":["Начаты основы аналитики","Начат Excel"],"project":false}');
function save(){localStorage.setItem("aa_full",JSON.stringify(state))}
function xp(n,msg){state.xp+=n;state.activity.unshift(msg||`Получено +${n} XP`);state.activity=state.activity.slice(0,15);save();toast(`+${n} XP`)}
function toast(t){let x=document.createElement("div");x.className="toast";x.textContent=t;document.body.appendChild(x);setTimeout(()=>x.remove(),2200)}
function money(n){return n.toLocaleString("ru-RU")+" AED"}
function render(id="dashboard"){
document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("on",b.dataset.v===id));
const a=document.getElementById("app"); let html="";
if(id==="dashboard") html=dashboard();
if(id==="roadmap") html=roadmap();
if(id==="excel") html=excel();
if(id==="sql") html=sql();
if(id==="python") html=python();
if(id==="powerbi") html=powerbi();
if(id==="practice") html=practice();
if(id==="project") html=project();
if(id==="portfolio") html=portfolio();
if(id==="university") html=university();
if(id==="progress") html=progress();
if(id==="achievements") html=achievements();
if(id==="activity") html=activity();
if(id==="profile") html=profile();
a.innerHTML=html; bind(id); window.scrollTo({top:0,behavior:"smooth"});
}
function head(k,t,s){return `<div class="top"><div><div class="eyebrow">${k}</div><div class="h1">${t}</div>${s?`<p class="muted">${s}</p>`:""}</div></div>`}
function dashboard(){let pct=Math.min(100,Math.round(state.done.length/48*100));return head("Analytics Academy",`С возвращением, ${state.name} 👋`,"Продолжим твой путь от новичка до начинающего аналитика.")+`
<div class="grid g2"><div class="card hero"><div class="eyebrow">Общий прогресс</div><div class="big">${pct}%</div><div class="progress"><i style="width:${pct}%"></i></div><p class="muted">30% теории · 70% практики</p></div>
<div class="card"><div class="eyebrow">Миссия дня</div><h2>🎯 SUM и AVERAGE</h2><p class="muted">Научись считать показатели в таблице.</p><button class="btn" data-go="excel">Начать →</button></div></div>
<div class="section"><h2>Продолжить обучение</h2></div><div class="card"><div class="row"><div><div class="eyebrow">Excel · следующий урок</div><h2>${lessons[3]}</h2><p class="muted">Применяй формулы к реальным данным.</p></div><button class="btn" data-go="excel">Продолжить</button></div></div>
<div class="section"><h2>Навыки</h2></div><div class="grid g4">${skill("Excel",35)}${skill("SQL",0)}${skill("Python",0)}${skill("Power BI",0)}</div>
<div class="section"><h2>Быстрый доступ</h2></div><div class="grid g3"><div class="card"><h3>🧪 Практика</h3><p class="muted">Небольшие datasets.</p><button class="btn alt" data-go="practice">Открыть</button></div><div class="card"><h3>🏎️ Первый проект</h3><p class="muted">Car Sales Analysis.</p><button class="btn alt" data-go="project">Открыть</button></div><div class="card"><h3>🎓 Портфолио</h3><p class="muted">Подготовка для университета.</p><button class="btn alt" data-go="university">Открыть</button></div></div>`}
function skill(n,p){return `<div class="card"><div class="row"><b>${n}</b><span>${p}%</span></div><div class="progress" style="margin-top:14px"><i style="width:${p}%"></i></div></div>`}
function roadmap(){return head("Путь", "Дорожная карта","Каждый следующий уровень открывается постепенно.")+`<div class="card">${["Основы аналитики","Excel","SQL","Python","Power BI","Реальные проекты","Университетское портфолио"].map((x,i)=>`<div class="lesson ${i<2?"done":""}"><div class="num">${i<2?"✓":i+1}</div><div><b>${x}</b><br><span class="pill">${i===1?"Текущий уровень":i<2?"Завершено":"Заблокировано"}</span></div><span class="status ${i===1?"blue":i<2?"green":""}">${i===1?"В процессе":i<2?"Завершено":"Заблокировано"}</span></div>`).join("")}</div>`}
function excel(){return head("Уровень 2","Excel","12 уроков: от интерфейса до мини-проекта.")+`<div class="grid g2"><div class="card"><div class="eyebrow">Прогресс курса</div><div class="big">${Math.round(state.done.filter(x=>lessons.includes(x)).length/12*100)}%</div><div class="progress"><i style="width:${Math.round(state.done.filter(x=>lessons.includes(x)).length/12*100)}%"></i></div></div><div class="card"><b>Правило</b><p class="muted">Каждый урок заканчивается практическим действием.</p></div></div><div class="section"><h2>Уроки</h2></div><div class="card">${lessons.map((l,i)=>{let d=state.done.includes(l);return `<div class="lesson ${d?"done":""}"><div class="num">${d?"✓":i+1}</div><div><b>${l}</b><br><span class="pill">${i<3?"База":i<7?"Формулы":i<11?"Работа с данными":"Проект"}</span></div><button class="btn ${d?"alt":""}" data-lesson="${i}">${d?"Повторить":"Начать"}</button></div>`}).join("")}</div>`}
function sql(){return head("Уровень 3","SQL","Запрашивай данные понятным языком запросов.")+`<div class="card"><div class="notice">В учебной версии SQL работает на безопасном демонстрационном наборе данных.</div><h2 style="margin-top:20px">Пример</h2><textarea class="code">SELECT brand, price
FROM cars
WHERE price > 100000
ORDER BY price DESC;</textarea><button class="btn" id="runSql" style="margin-top:10px">▶ Выполнить</button><div id="sqlOut"></div></div><div class="section"><h2>Путь SQL</h2></div><div class="grid g3">${["SELECT","WHERE","ORDER BY","GROUP BY","COUNT","SUM","JOIN","Реальный SQL-проект"].map(x=>`<div class="card"><b>${x}</b><p class="muted">Практика темы</p></div>`).join("")}</div>`}
function python(){return head("Уровень 4","Python","Начни с переменных, списков и pandas.")+`<div class="card"><h2>Мини-лаборатория</h2><p class="muted">Редактор ниже имитирует безопасный учебный запуск.</p><textarea class="code" id="py">prices = [100, 200, 300]
average = sum(prices) / len(prices)
print(average)</textarea><button class="btn" id="runPy" style="margin-top:10px">▶ Запустить</button><div id="pyOut"></div></div>`}
function powerbi(){return head("Уровень 5","Power BI","Превращай данные в понятные бизнес-дашборды.")+`<div class="grid g3"><div class="card"><div class="eyebrow">Продажи</div><div class="big">4.1M</div><p class="muted">AED</p></div><div class="card"><div class="eyebrow">Средняя цена</div><div class="big">96K</div><p class="muted">AED</p></div><div class="card"><div class="eyebrow">Лидер</div><div class="big">BMW</div><p class="muted">по количеству</p></div></div><div class="section"><h2>Уроки</h2></div><div class="grid g4">${["Импорт данных","Очистка","Графики","Дашборды","Фильтры","KPI","Визуализация","Финальный dashboard"].map(x=>`<div class="card"><b>${x}</b><p class="muted">Скоро доступно</p></div>`).join("")}</div>`}
function practice(){return head("Практика","Practice Lab","Dataset → вопросы → анализ → выводы.")+`<div class="grid g2">${[["🏎️","Car Sales","Продажи автомобилей","project"],["🏠","Housing","Цены недвижимости","project"],["🛒","Online Store","Интернет-магазин","project"],["📱","Social Media","Просмотры и вовлечённость","project"]].map(x=>`<div class="card"><h2>${x[0]} ${x[1]}</h2><p class="muted">${x[2]}</p><button class="btn alt" data-go="${x[3]}">Открыть</button></div>`).join("")}</div>`}
function table(){return `<div class="tablewrap"><table class="data"><thead><tr><th>Дата</th><th>Бренд</th><th>Город</th><th>Цена</th><th>Количество</th><th>Канал</th><th>Продажи</th></tr></thead><tbody>${DATA.map(r=>`<tr>${r.map((v,i)=>`<td>${i===3||i===6?money(i===6?v*v*0+v*r[4]:v):v}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`}
function project(){let sales=DATA.reduce((s,r)=>s+r[3]*r[4],0),avg=Math.round(DATA.reduce((s,r)=>s+r[3],0)/DATA.length);let counts={};DATA.forEach(r=>counts[r[1]]=(counts[r[1]]||0)+r[4]);let leader=Object.entries(counts).sort((a,b)=>b[1]-a[1])[0][0];return head("Реальный проект","🏎️ Car Sales Analysis","Найди закономерности и предложи решения для бизнеса.")+`<div class="grid g4"><div class="card"><div class="eyebrow">Продажи</div><div class="big">${(sales/1000000).toFixed(2)}M</div></div><div class="card"><div class="eyebrow">Средняя цена</div><div class="big">${Math.round(avg/1000)}K</div></div><div class="card"><div class="eyebrow">Лидер</div><div class="big">${leader}</div></div><div class="card"><div class="eyebrow">Строк</div><div class="big">${DATA.length}</div></div></div><div class="section"><h2>Dataset</h2></div><div class="card">${table()}</div><div class="section"><h2>Твои выводы</h2></div><div class="card"><p class="muted">Напиши 3 закономерности и 2 рекомендации.</p><textarea class="area" id="f1" placeholder="Закономерность 1"></textarea><br><br><textarea class="area" id="f2" placeholder="Закономерность 2"></textarea><br><br><textarea class="area" id="f3" placeholder="Закономерность 3"></textarea><br><br><textarea class="area" id="r1" placeholder="Рекомендация 1"></textarea><br><br><textarea class="area" id="r2" placeholder="Рекомендация 2"></textarea><br><br><button class="btn" id="submitProject">${state.project?"Проект завершён ✓":"Завершить проект (+100 XP)"}</button></div>`}
function portfolio(){return head("Работы","Моё портфолио","Только реально завершённые проекты.")+`<div class="grid g3"><div class="card"><div class="eyebrow">Проект 01</div><h2>🏎️ Car Sales Analysis</h2><p class="muted">Excel · Data Analysis · Business Thinking</p><span class="status ${state.project?"green":"blue"}">${state.project?"Завершено":"В процессе"}</span></div><div class="card" style="opacity:.55"><h2>🏠 Valencia Housing Market</h2><p class="muted">Python · Visualization</p><span class="status">Заблокировано</span></div><div class="card" style="opacity:.55"><h2>🛒 Online Store Analysis</h2><p class="muted">SQL · Business Analysis</p><span class="status">Заблокировано</span></div></div>`}
function university(){return head("Будущий профиль","🎓 Портфолио для университета","Профессиональная основа для будущих заявок и стажировок.")+`<div class="card hero"><h2>${state.name}</h2><p class="muted">Aspiring Data Analyst</p><div class="grid g4"><div><b>Excel</b><p>Начальный</p></div><div><b>SQL</b><p>Изучение</p></div><div><b>Python</b><p>Изучение</p></div><div><b>Power BI</b><p>Изучение</p></div></div></div><div class="section"><h2>Проекты</h2></div><div class="card"><b>Car Sales Analysis</b><p class="muted">${state.project?"Завершён":"В процессе"}</p></div>`}
function progress(){let p=Math.min(100,Math.round(state.done.length/48*100));return head("Статистика","Мой прогресс","Отслеживай реальные результаты обучения.")+`<div class="grid g4"><div class="card"><div class="big">${state.xp}</div><span class="muted">XP</span></div><div class="card"><div class="big">${state.done.length}</div><span class="muted">уроков</span></div><div class="card"><div class="big">${state.project?1:0}</div><span class="muted">проектов</span></div><div class="card"><div class="big">${p}%</div><span class="muted">общий прогресс</span></div></div><div class="section"><h2>Следующий уровень</h2></div><div class="card"><div class="row"><b>${state.xp>=500?"Data Analyst":state.xp>=250?"Младший аналитик":state.xp>=100?"Исследователь":"Новичок"}</b><span>${state.xp%100}/100 XP</span></div><div class="progress" style="margin-top:13px"><i style="width:${state.xp%100}%"></i></div></div>`}
function achievements(){let arr=[["🏆","Первый анализ",state.done.length>0],["📊","Excel Starter",state.done.length>=4],["⚡","100 XP",state.xp>=100],["🧪","Первый проект",state.project],["💼","Portfolio Builder",false],["🎓","University Ready",false]];return head("Мотивация","Достижения","Профессиональные milestones, а не гонка за баллами.")+`<div class="grid g3">${arr.map(a=>`<div class="card" style="opacity:${a[2]?1:.5}"><div class="badge">${a[0]}</div><h3>${a[1]}</h3><p class="muted">${a[2]?"Разблокировано":"Ещё в процессе"}</p></div>`).join("")}</div>`}
function activity(){return head("История","Последняя активность","Твои действия и результаты.")+`<div class="card activity">${state.activity.map(x=>`<div>✓ ${x}</div>`).join("")}</div>`}
function profile(){return head("Аккаунт","Мой профиль","Настрой данные пользователя.")+`<div class="card"><h2>${state.name}</h2><p class="muted">Начинающий Data Analyst</p><input class="input" id="name" value="${state.name}"><br><br><button class="btn" id="saveName">Сохранить</button></div>`}
function bind(id){
document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>render(b.dataset.go));
document.querySelectorAll("[data-lesson]").forEach(b=>b.onclick=()=>lesson(Number(b.dataset.lesson)));
if(id==="sql")document.getElementById("runSql").onclick=()=>document.getElementById("sqlOut").outerHTML='<div class="output">Результат:\\nBMW | 110000\\nMercedes | 130000\\nMercedes | 127000</div>';
if(id==="python")document.getElementById("runPy").onclick=()=>{let t=document.getElementById("py").value,m=t.match(/\\[(.*?)\\]/s);let n=m?m[1].split(",").map(Number).filter(x=>!isNaN(x)):[];document.getElementById("pyOut").outerHTML=`<div class="output">Результат: ${n.length?n.reduce((a,b)=>a+b,0)/n.length:"Проверь список prices"}</div>`};
if(id==="project")document.getElementById("submitProject").onclick=()=>{let ok=["f1","f2","f3","r1","r2"].every(x=>document.getElementById(x).value.trim());if(!ok){toast("Заполни 3 закономерности и 2 рекомендации");return}if(!state.project){state.project=true;xp(100,"Завершён Car Sales Analysis")}else toast("Проект уже завершён");render("project")};
if(id==="profile")document.getElementById("saveName").onclick=()=>{let n=document.getElementById("name").value.trim();if(n){state.name=n;save();toast("Профиль сохранён");render("profile")}};
}
function lesson(i){if(i>0&&!state.done.includes(lessons[i-1])){toast("Сначала пройди предыдущий урок");return}let l=lessons[i];let text={3:"Какую формулу Excel ты используешь, чтобы сложить B2:B4?",4:"Какую функцию используешь, чтобы найти среднее значение?",5:"Какая функция находит самое маленькое значение?"}[i]||`Что ты должен уметь после урока «${l}»?`;document.getElementById("app").innerHTML=head("Excel · урок "+(i+1),l,"Изучаем → пример → задача → подсказка → повторная попытка")+`<div class="card"><h2>🧠 Изучаем</h2><p>Разберём тему простыми словами и сразу применим её на данных.</p><div class="notice"><b>Главная идея:</b> не просто прочитать, а самостоятельно сделать действие.</div><h2>👀 Пример</h2><div class="tablewrap"><table class="data"><tr><th>Автомобиль</th><th>Цена</th></tr><tr><td>BMW</td><td>100000</td></tr><tr><td>Audi</td><td>80000</td></tr><tr><td>Mercedes</td><td>120000</td></tr></table></div><h2>🎯 Твоё задание</h2><p>${text}</p><input class="input" id="ans" placeholder="Твой ответ"><br><br><button class="btn alt" id="hint">💡 Нужна подсказка?</button> <button class="btn" id="check">Проверить</button><div id="feedback"></div></div>`;
document.getElementById("hint").onclick=()=>document.getElementById("feedback").innerHTML='<div class="notice" style="margin-top:12px">Подумай, какую функцию Excel мы только что изучили. Не спеши смотреть ответ.</div>';
document.getElementById("check").onclick=()=>{let v=document.getElementById("ans").value.trim().toUpperCase().replaceAll(" ","");let good=(i===3&&["=SUM(B2:B4)","SUM(B2:B4)"].includes(v))||(i===4&&v.includes("AVERAGE"))||(i===5&&v.includes("MIN"));let f=document.getElementById("feedback");if(good){if(!state.done.includes(l)){state.done.push(l);xp(10,"Завершён урок: "+l)}f.innerHTML='<div class="notice" style="margin-top:12px">✅ Правильно! Отличная работа. +10 XP</div>';save()}else f.innerHTML='<div class="notice" style="margin-top:12px">🟡 Пока не получилось. Посмотри на данные и попробуй ещё раз. Ответ не показываем сразу.</div>'};
}
document.querySelectorAll(".nav button[data-v]").forEach(b=>b.onclick=()=>render(b.dataset.v));
const modal=document.getElementById("modal");document.getElementById("tutor").onclick=()=>modal.classList.remove("hide");document.getElementById("tutorNav").onclick=()=>modal.classList.remove("hide");document.getElementById("close").onclick=()=>modal.classList.add("hide");
document.getElementById("send").onclick=()=>{let q=document.getElementById("chatInput").value.trim();if(!q)return;let c=document.getElementById("chat");c.innerHTML+=`<div class="bubble me">${q.replaceAll("<","&lt;")}</div>`;let a=/excel|sum|average|формул/i.test(q)?"Посмотри на столбец с числами. Какую операцию тебе нужно выполнить — сложить значения или найти их среднее?":/sql/i.test(q)?"Начни с вопроса: какие столбцы тебе нужны? После этого подумай, какой SELECT поможет их получить.":"Давай разберём это по шагам. Сначала назови данные, которые у тебя есть, и что именно нужно узнать.";c.innerHTML+=`<div class="bubble">${a}</div>`;document.getElementById("chatInput").value="";c.scrollTop=c.scrollHeight};
render();
</script></body></html>
