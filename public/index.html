let state=JSON.parse(localStorage.getItem("aa_final")||'{"name":"","xp":0,"done":[],"answers":0,"correct":0,"streak":0,"lastLesson":"","portfolio":[],"projectDone":[]}');
let currentLesson=null,currentExercise=null;
const modules=DATA.modules, lessons=DATA.lessons, exercises=DATA.exercises, projects=DATA.projects;
const navItems=[["dashboard","🏠","Главная"],["courses","📚","Курсы"],["practice","🧪","Практика"],["projects","🚗","Проекты"],["interview","🎤","Interview Lab"],["portfolio","💼","Портфолио"],["university","🎓","Университет"],["progress","📈","Прогресс"],["achievements","🏆","Достижения"],["profile","👤","Профиль"],["academy","🧠","AI & Adaptive"],["exams","📝","Экзамены"],["playground","💻","Playground"],["datasets","🗃️","Datasets"]];
function save(){localStorage.setItem("aa_final",JSON.stringify(state));sync();}
async function sync(){try{await fetch("/api/state",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({user:"main-"+btoa(location.hostname),state})})}catch(e){}}
async function load(){try{let r=await fetch("/api/state?user="+encodeURIComponent("main-"+btoa(location.hostname)));let x=await r.json();if(x&&x.name)state={...state,...x}}catch(e){}}
function toast(t){let x=document.getElementById("toast");x.textContent=t;x.classList.add("show");setTimeout(()=>x.classList.remove("show"),2200)}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function head(k,t,s){return `<div class="top"><div><div class="eyebrow">${k}</div><div class="h1">${t}</div><div class="muted">${s}</div></div><div class="account"><span class="muted">${esc(state.name||"Гость")}</span><div class="avatar">${(state.name||"A")[0].toUpperCase()}</div></div></div>`}
function progress(){return Math.min(100,Math.round((state.done.length/lessons.length)*100))}
function nav(active){document.getElementById("nav").innerHTML=navItems.map(x=>`<button class="${active==x[0]?"active":""}" onclick="go('${x[0]}')">${x[1]} ${x[2]}</button>`).join("");document.getElementById("mobile").innerHTML=navItems.slice(0,5).map(x=>`<button onclick="go('${x[0]}')">${x[1]}<br>${x[2]}</button>`).join("")}
function go(p){nav(p);({dashboard,courses,practice,projects,interview,portfolio,university,progressPage:progressPage,achievements,profile,academy:adaptive,exams,playground,datasets}[p]||dashboard)()}
function dashboard(){document.getElementById("app").innerHTML=head("Analytics Academy","С возвращением, "+esc(state.name||"аналитик")+" 👋","Большая программа Data Analytics: теория → практика → проекты → портфолио.")+`
<div class="grid g4"><div class="card"><div class="tag">ОБЩИЙ ПРОГРЕСС</div><div class="stat">${progress()}%</div><div class="progress"><i style="width:${progress()}%"></i></div></div>
<div class="card"><div class="tag">XP</div><div class="stat">${state.xp}</div><div class="muted">за уроки и практику</div></div>
<div class="card"><div class="tag">ПРАКТИКА</div><div class="stat">${state.correct}/${state.answers}</div><div class="muted">правильных ответов</div></div>
<div class="card"><div class="tag">УРОКИ</div><div class="stat">${state.done.length}/${lessons.length}</div><div class="muted">пройдено</div></div></div>
<br><div class="grid g3"><div class="card"><h2>🧠 Adaptive</h2><p class="muted">Персональный следующий шаг.</p><button class="btn secondary" onclick="go('academy')">Открыть</button></div><div class="card"><h2>📝 Exam</h2><p class="muted">Проверь знания.</p><button class="btn secondary" onclick="go('exams')">Экзамен</button></div><div class="card"><h2>💻 Playground</h2><p class="muted">Тренируй SQL/Python.</p><button class="btn secondary" onclick="go('playground')">Открыть</button></div></div><br><div class="grid g2"><div class="card"><h2>🎯 Миссия дня</h2><p class="muted">Пройди один урок и реши 5 практических заданий.</p><button class="btn" onclick="go('practice')">Начать →</button></div>
<div class="card"><h2>🗺️ Следующий шаг</h2><p>${esc(lessons.find(l=>!state.done.includes(l.id))?.title||"Все уроки пройдены!")}</p><button class="btn" onclick="openNext()">Продолжить →</button></div></div>
<br><div class="card"><h2>🔥 Твой маршрут</h2><div class="grid g4">${modules.map(m=>{let n=lessons.filter(l=>l.module==m.id).length,d=lessons.filter(l=>l.module==m.id&&state.done.includes(l.id)).length;return `<div><b>${m.icon} ${m.title}</b><div class="muted">${d}/${n}</div><div class="progress"><i style="width:${Math.round(d/n*100)}%"></i></div></div>`}).join("")}</div></div>`}
function courses(){document.getElementById("app").innerHTML=head("Обучение","Курсы","${lessons.length} уроков с теорией, примерами и практикой.")+`<div class="grid g2">${modules.map(m=>{let ls=lessons.filter(l=>l.module==m.id),d=ls.filter(l=>state.done.includes(l.id)).length;return `<div class="card"><div class="row"><h2>${m.icon} ${m.title}</h2><span class="pill">${d}/${ls.length}</span></div><p class="muted">Полный модуль с уроками, упражнениями и мини-проектом.</p>${ls.slice(0,4).map(l=>`<div class="lesson" onclick="lesson('${l.id}')"><div class="num">${state.done.includes(l.id)?"✓":"→"}</div><div><b>${l.title}</b><div class="tag">${l.level} · ${l.minutes} мин · ${l.points} XP</div></div></div>`).join("")}<button class="btn secondary" onclick="module('${m.id}')">Открыть весь модуль →</button></div>`}).join("")}</div>`}
function module(id){let m=modules.find(x=>x.id==id),ls=lessons.filter(l=>l.module==id);document.getElementById("app").innerHTML=head(m.icon,m.title,`Полный модуль · ${ls.length} уроков`)+`<div class="card"><div class="progress"><i style="width:${Math.round(ls.filter(l=>state.done.includes(l.id)).length/ls.length*100)}%"></i></div><br>${ls.map((l,i)=>`<div class="lesson" onclick="lesson('${l.id}')"><div class="num">${state.done.includes(l.id)?"✓":i+1}</div><div style="flex:1"><b>${l.title}</b><div class="muted">${l.summary}</div><div class="tag">${l.level} · ${l.minutes} минут · ${l.points} XP</div></div></div>`).join("")}</div>`}
function lesson(id){let l=lessons.find(x=>x.id==id);currentLesson=l;document.getElementById("app").innerHTML=head(l.icon,l.title,`${l.level} · ${l.minutes} минут · ${l.points} XP`)+`<div class="grid g2"><div class="card"><h2>📖 Теория</h2><p><b>Цель:</b> ${esc(l.goal||"Освоить тему и применить её на данных.")}</p>${l.key_points.map((x,i)=>`<p><b>${i+1}.</b> ${x}</p>`).join("")}<h3>⚠️ Типичные ошибки</h3>${(l.common_mistakes||[]).map(x=>`<p class="muted">• ${esc(x)}</p>`).join("")}</div><div class="card"><h2>💡 Пример</h2><pre style="white-space:pre-wrap;background:#06111d;padding:15px;border-radius:12px">${esc(l.example)}</pre><h3>🧪 Мини-практика</h3><p>${esc(l.mini_task||"Сделай маленькое упражнение по теме.")}</p><h3>Проверь себя</h3><p class="muted">${l.check}</p><button class="btn" onclick="finishLesson('${l.id}')">${state.done.includes(l.id)?"Повторить":"Завершить урок"} (+${l.points} XP)</button></div></div>`}
function finishLesson(id){let l=lessons.find(x=>x.id==id);if(!state.done.includes(id)){state.done.push(id);state.xp+=l.points;save();toast("Урок завершён +"+l.points+" XP")}else toast("Урок уже пройден");}
function openNext(){let l=lessons.find(x=>!state.done.includes(x.id))||lessons[0];lesson(l.id)}
function practice(){let pool=exercises;currentExercise=pool[Math.floor(Math.random()*pool.length)];document.getElementById("app").innerHTML=head("Practice Lab","Практика","${exercises.length} заданий · решай, ошибайся, разбирай и повторяй.")+`<div class="card"><div class="row"><span class="pill">${currentExercise.category}</span><span class="tag">${currentExercise.difficulty}</span></div><h2>${currentExercise.question}</h2>${currentExercise.options.map(o=>`<button class="option" onclick="answer(this,${JSON.stringify(o)})">${esc(o)}</button>`).join("")}<div id="explain"></div></div>`}
function answer(el,o){if(document.querySelector(".option.correct,.option.wrong"))return;state.answers++;let ok=o===currentExercise.answer;if(ok){el.classList.add("correct");state.correct++;state.xp+=10;document.getElementById("explain").innerHTML=`<p>✅ ${esc(currentExercise.explanation)}</p><button class="btn" onclick="practice()">Следующее задание →</button>`}else{el.classList.add("wrong");document.getElementById("explain").innerHTML=`<p>❌ Попробуй ещё раз. Подсказка: вспомни основное правило темы «${currentExercise.category}».</p>`}save()}
function projects(){document.getElementById("app").innerHTML=head("Real Projects","Проекты","12 бизнес-кейсов от постановки вопроса до портфолио.")+`<div class="grid g3">${projects.map(p=>`<div class="card"><div class="big">${p[1]}</div><h2>${p[2]}</h2><div class="pill">${p[4]}</div><p class="muted">${p[5]}</p><h4>Этапы</h4><p class="tag">Problem → Data → Cleaning → Analysis → Visualization → Insights → Recommendation → Portfolio</p><button class="btn" onclick="project('${p[0]}')">Открыть кейс →</button></div>`).join("")}</div>`}
function project(id){let p=projects.find(x=>x[0]==id);document.getElementById("app").innerHTML=head("Project Lab",p[2],"Полный рабочий процесс аналитика.")+`<div class="grid g2"><div class="card"><h2>Бизнес-задача</h2><p>${p[5]}</p><h3>Dataset</h3><p class="tag">${(p[6]||[]).join(" · ")}</p><h3>Чек-лист</h3>${["Сформулировать 3 бизнес-вопроса","Проверить качество данных","Очистить и подготовить dataset","Рассчитать KPI","Найти 3 закономерности","Создать 3 визуализации","Сформулировать рекомендации","Оформить результат для портфолио"].map((x,i)=>`<p>□ ${i+1}. ${x}</p>`).join("")}</div><div class="card"><h2>📦 Артефакты проекта</h2><p class="muted">В финальной версии сюда можно прикрепить dataset, SQL/Python notebook, Power BI report и презентацию.</p><button class="btn green" onclick="completeProject('${id}')">Отметить проект завершённым</button></div></div>`}
function completeProject(id){if(!state.projectDone.includes(id)){state.projectDone.push(id);state.xp+=150;save();toast("Проект завершён +150 XP")}}
function interview(){document.getElementById("app").innerHTML=head("Interview Lab","Подготовка к собеседованию","Тренируй ответы как начинающий Data Analyst.")+`<div class="grid g2">${["SQL","Excel","Python","Statistics","Business Case","Power BI"].map((x,i)=>`<div class="card"><h2>🎤 ${x}</h2><p class="muted">${10+i*2} вопросов + разбор типичных ошибок.</p><button class="btn" onclick="practice()">Начать mock interview →</button></div>`).join("")}</div>`}
function portfolio(){document.getElementById("app").innerHTML=head("Portfolio","Моё портфолио","Собирай проекты и превращай учебную работу в реальные кейсы.")+`<div class="card"><h2>Проекты</h2>${state.projectDone.length?state.projectDone.map(id=>`<p>✅ ${projects.find(p=>p[0]==id)?.[2]}</p>`).join(""):"<p class='muted'>Заверши первый проект, чтобы он появился здесь.</p>"}<br><button class="btn" onclick="go('projects')">Добавить проект</button></div><br><div class="card"><h2>Профиль аналитика</h2><p>Навыки: Excel · SQL · Python · Power BI · Statistics · Business Analytics</p><p>Уроков: ${state.done.length}/${lessons.length} · XP: ${state.xp}</p></div>`}
function university(){document.getElementById("app").innerHTML=head("University Ready","Университет","Материалы для подготовки к учёбе и поступлению.")+`<div class="grid g2">${["Как собрать академический профиль","Как оформить Data Analytics portfolio","Как описывать проекты","Как читать требования программы","Excel/SQL/Python для первого курса","Математика и statistics foundation","English terminology for analytics","Interview & internship preparation"].map((x,i)=>`<div class="card"><h3>🎓 ${x}</h3><p class="muted">Материал ${i+1}: чек-лист, пример и практическое задание.</p><button class="btn secondary" onclick="toast('Материал открыт')">Открыть</button></div>`).join("")}</div>`}
function progressPage(){document.getElementById("app").innerHTML=head("Progress","Прогресс","Смотри не только процент, но и реальные навыки.")+`<div class="grid g3"><div class="card"><div class="tag">УРОКИ</div><div class="stat">${state.done.length}</div></div><div class="card"><div class="tag">ТОЧНОСТЬ</div><div class="stat">${state.answers?Math.round(state.correct/state.answers*100):0}%</div></div><div class="card"><div class="tag">ПРОЕКТЫ</div><div class="stat">${state.projectDone.length}/${projects.length}</div></div></div><br><div class="card"><h2>Навыки по модулям</h2>${modules.map(m=>{let ls=lessons.filter(l=>l.module==m.id),d=ls.filter(l=>state.done.includes(l.id)).length;return `<p><b>${m.icon} ${m.title}</b> — ${Math.round(d/ls.length*100)}%</p><div class="progress"><i style="width:${d/ls.length*100}%"></i></div><br>`}).join("")}</div>`}
function achievements(){let ach=[["🌱","Первый урок",state.done.length>=1],["🔥","10 уроков",state.done.length>=10],["🏅","50 уроков",state.done.length>=50],["🧪","10 практик",state.correct>=10],["🎯","90% accuracy",state.answers>=10&&state.correct/state.answers>=.9],["🚗","Первый проект",state.projectDone.length>=1],["💎","500 XP",state.xp>=500]];document.getElementById("app").innerHTML=head("Achievements","Достижения","Маленькие победы превращаются в большой навык.")+`<div class="grid g3">${ach.map(a=>`<div class="card" style="opacity:${a[2]?1:.45}"><div class="big">${a[0]}</div><h3>${a[1]}</h3><p>${a[2]?"Получено":"Заблокировано"}</p></div>`).join("")}</div>`}
function profile(){document.getElementById("app").innerHTML=head("Profile","Профиль","Настрой имя и учебные цели.")+`<div class="card"><label class="tag">Имя</label><input class="input" id="pname" value="${esc(state.name)}"><br><br><button class="btn" onclick="state.name=document.getElementById('pname').value.trim()||'Аналитик';save();dashboard()">Сохранить</button></div>`}

function adaptive(){
 let stats=modules.map(m=>{let ls=lessons.filter(l=>l.module==m.id),d=ls.filter(l=>state.done.includes(l.id)).length;return [m,d?Math.round(d/ls.length*100):0]});
 let weak=[...stats].sort((a,b)=>a[1]-b[1]).slice(0,3);
 document.getElementById("app").innerHTML=head("AI & Adaptive","Персональный план","Сайт анализирует твой прогресс и предлагает следующий шаг.")+
 `<div class="grid g2"><div class="card"><h2>🧠 Что изучать сейчас</h2><p>Твоя самая слабая зона: <b>${weak[0][0].title}</b> — ${weak[0][1]}%.</p><p class="muted">Рекомендация: пройти 2 урока, затем 10 практических вопросов по этой теме.</p><button class="btn" onclick="module('${weak[0][0].id}')">Открыть модуль →</button></div>
 <div class="card"><h2>🔥 Daily Mission</h2><p>1 урок + 5 практических вопросов + 10 минут Playground.</p><button class="btn green" onclick="practice()">Начать миссию →</button></div></div><br>
 <div class="card"><h2>📊 Skill Radar</h2><div class="radar">${stats.map(s=>`<div class="skillrow"><b>${s[0].icon} ${s[0].title}</b><div class="bar"><i style="width:${s[1]}%"></i></div><span>${s[1]}%</span></div>`).join("")}</div></div>`;
}
function exams(){
 let qs=DATA.examQuestions, idx=0, score=0, timer=60, interval;
 function renderQ(){
   if(idx>=qs.length){clearInterval(interval);document.getElementById("app").innerHTML=head("Exam Mode","Экзамен завершён","Результат сохраняется в твоём профиле.")+
   `<div class="card"><div class="big">${score}/${qs.length}</div><h2>${Math.round(score/qs.length*100)}%</h2><p class="muted">Повтори темы, где были ошибки, и попробуй снова.</p><button class="btn" onclick="go('exams')">Пройти снова</button></div>`;return;}
   let q=qs[idx];document.getElementById("app").innerHTML=head("Exam Mode","Final Data Analyst Exam",`Вопрос ${idx+1} из ${qs.length}`)+
   `<div class="card"><div class="row"><span class="badge">${q.cat}</span><span class="timer" id="tm">${timer}s</span></div><h2>${q.q}</h2>${q.o.map(o=>`<button class="choice" onclick="window.__exam('${o.replace(/'/g,"\\'")}')">${o}</button>`).join("")}</div>`;
 }
 window.__exam=(o)=>{let q=qs[idx];document.querySelectorAll(".choice").forEach(b=>{b.disabled=true;if(b.textContent===q.a)b.classList.add("good");if(b.textContent===o&&o!==q.a)b.classList.add("bad")});if(o===q.a){score++;state.xp+=20}idx++;setTimeout(renderQ,700);save()};
 clearInterval(interval);timer=60;renderQ();interval=setInterval(()=>{timer--;let t=document.getElementById("tm");if(t)t.textContent=timer+"s";if(timer<=0){idx++;timer=60;renderQ()}},1000);
}
function playground(){
 document.getElementById("app").innerHTML=head("Analytics Playground","Рабочая среда","Безопасная учебная песочница для аналитических задач.")+
 `<div class="grid g2"><div class="card"><h2>🗄️ SQL Lab</h2><p class="muted">Практикуй запросы на учебном датасете. В этой версии редактор имитирует проверку ключевых конструкций.</p><textarea class="codebox" id="sqlcode" placeholder="SELECT brand, SUM(revenue) FROM sales GROUP BY brand;"></textarea><br><br><button class="btn" onclick="runSQL()">▶ Проверить SQL</button><div id="sqlout"></div></div>
 <div class="card"><h2>🐍 Python Lab</h2><p class="muted">Пиши Pandas-код и объясняй, что он делает. Выполнение произвольного кода на сервере пока отключено.</p><textarea class="codebox" id="pycode" placeholder="df.groupby('category')['revenue'].sum()"></textarea><br><br><button class="btn" onclick="runPy()">▶ Проверить решение</button><div id="pyout"></div></div></div>
 <br><div class="notice">🛡️ Безопасность: произвольный пользовательский код не выполняется на сервере. Настоящий sandbox можно подключить отдельно через изолированный execution service.</div>`;
}
function runSQL(){let s=(document.getElementById("sqlcode").value||"").toUpperCase(),need=["SELECT"];let ok=need.every(x=>s.includes(x));if(s.includes("GROUP BY"))ok=true;document.getElementById("sqlout").innerHTML=`<p class="${ok?"":"muted"}">${ok?"✅ Похоже на корректный учебный SQL. Теперь проверь JOIN, фильтр и агрегирование.":"💡 Начни с SELECT и опиши, какие поля хочешь получить."}</p>`;state.xp+=ok?5:0;save()}
function runPy(){let s=document.getElementById("pycode").value||"",ok=/df|pandas|groupby|read_csv|loc|iloc/.test(s);document.getElementById("pyout").innerHTML=`<p>${ok?"✅ В решении есть знакомая Pandas-конструкция. Следующий шаг — проверить типы и результат.":"💡 Попробуй использовать DataFrame df и одну из операций Pandas: filter, groupby, loc."}</p>`;state.xp+=ok?5:0;save()}
function datasets(){
 document.getElementById("app").innerHTML=head("Datasets","Dataset Library","Наборы данных для практики и проектов.")+
 `<div class="grid g3">${DATA.datasets.map(d=>`<div class="card"><div class="badge">${d.rows.toLocaleString()} rows</div><h2>🗃️ ${d.name}</h2><p class="muted">${d.columns} колонок · ${d.tools}</p><p>${d.focus}</p><button class="btn secondary" onclick="toast('Dataset выбран для практики')">Использовать →</button></div>`).join("")}</div>`;
}
function showWelcome(){let m=document.getElementById("modal");m.classList.remove("hide");m.innerHTML=`<div class="modalbox"><div class="eyebrow">START HERE</div><h2>Создай учебный профиль</h2><p class="muted">Имя нужно только для персонализации твоего Dashboard.</p><input class="input" id="name" placeholder="Например, Иван"><br><br><button class="btn" onclick="state.name=document.getElementById('name').value.trim()||'Аналитик';save();m.classList.add('hide');dashboard()">Начать обучение →</button></div>`}
window.go=go;window.adaptive=adaptive;window.exams=exams;window.playground=playground;window.datasets=datasets;window.lesson=lesson;window.module=module;window.practice=practice;window.answer=answer;window.project=project;window.completeProject=completeProject;window.finishLesson=finishLesson;window.openNext=openNext;window.showWelcome=showWelcome;
(async()=>{await load();nav("dashboard");dashboard();if(!state.name)setTimeout(showWelcome,300)})();
</script></body></html>
